plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework.batch:spring-batch-core:6.0.4'
    implementation 'io.micrometer:micrometer-core:1.16.6'
    implementation 'io.micrometer:micrometer-tracing:1.6.6'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel:1.6.6'
    implementation 'io.opentelemetry:opentelemetry-sdk-testing:1.54.1'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testImplementation 'org.assertj:assertj-core:3.27.6'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.example.tracinghandler.TracingHandlerApplication'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed'
    }
}
